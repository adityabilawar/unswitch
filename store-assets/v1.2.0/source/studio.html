<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tab Lock Store Asset Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:#050508;color:#f8fafc;-webkit-font-smoothing:antialiased}
    :root{--blue:#60a5fa;--violet:#8b5cf6;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--ink:#050508;--surface:#101018;--line:rgba(255,255,255,.09);--muted:#a1a1b0}
    .asset{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(75% 90% at 82% 18%,rgba(59,130,246,.18),transparent 58%),radial-gradient(55% 80% at 8% 100%,rgba(139,92,246,.13),transparent 65%),linear-gradient(145deg,#080811 0%,#040407 66%,#090813 100%)}
    .noise{position:absolute;inset:0;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");mix-blend-mode:screen;pointer-events:none}
    .brand-mark{display:block}.mark-shell{fill:#0c0c15;stroke:rgba(255,255,255,.12);stroke-width:3}.mark-tab{fill:none;stroke:#f8fafc;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.mark-line{stroke:#70758b;stroke-width:8;stroke-linecap:round}.mark-glow{fill:#60a5fa}.mark-ring{fill:none;stroke:#a78bfa;stroke-width:7}
    .screen{display:flex;align-items:center;gap:5vw;padding:5.8vh 5.8vw}.copy{width:38vw;position:relative;z-index:3}.eyebrow{display:flex;align-items:center;gap:10px;color:#93c5fd;font-size:14px;line-height:1;font-weight:750;letter-spacing:.15em;text-transform:uppercase;margin-bottom:22px}.eyebrow:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:2px}.headline{font-size:clamp(46px,4.55vw,76px);line-height:.98;letter-spacing:-.055em;margin:0 0 25px;font-weight:820;max-width:600px}.headline .grad{background:linear-gradient(120deg,#fff 18%,#93c5fd 57%,#c4b5fd 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{max-width:510px;color:#aeb8ca;font-size:clamp(17px,1.45vw,23px);line-height:1.55;margin:0}.proof{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.proof span{font-size:13px;color:#cbd5e1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);padding:9px 12px;border-radius:999px}.browser{position:relative;width:51vw;height:84vh;max-height:690px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:#0d0f16;box-shadow:0 40px 100px rgba(0,0,0,.58),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden;z-index:2}.chrome{height:66px;background:#171923;border-bottom:1px solid rgba(255,255,255,.08);padding:14px 17px;display:flex;align-items:center;gap:14px}.dots{display:flex;gap:7px}.dots i{width:10px;height:10px;border-radius:50%;display:block}.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}.browser-tab{height:36px;min-width:210px;border-radius:10px 10px 5px 5px;background:#252836;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px;padding:0 13px;font-size:12px;color:#d6dae4}.browser-tab b{width:8px;height:8px;border-radius:3px;background:var(--blue);box-shadow:0 0 10px var(--blue)}.address{height:34px;flex:1;border-radius:10px;background:#0e1017;border:1px solid rgba(255,255,255,.06);color:#6f7484;font-size:11px;display:flex;align-items:center;padding:0 14px}.page{position:absolute;left:0;right:0;top:66px;bottom:0;padding:54px 44px;background:radial-gradient(75% 90% at 15% 20%,rgba(96,165,250,.09),transparent 58%),#0a0c12}.doc{max-width:58%;height:100%;background:#10131b;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:28px}.doc-label{display:inline-block;color:#93c5fd;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}.doc h3{font-size:25px;letter-spacing:-.035em;margin:0 0 22px}.rule{height:8px;background:#202432;border-radius:99px;margin:12px 0}.rule:nth-child(2n){width:78%}.rule:nth-child(3n){width:61%}.doc-card{margin-top:28px;padding:18px;background:#151925;border:1px solid rgba(255,255,255,.06);border-radius:12px}.popup{position:absolute;z-index:5;right:24px;top:88px;width:340px;padding:20px 18px 22px;background:radial-gradient(120% 80% at 50% -30%,rgba(96,165,250,.12),transparent 55%),radial-gradient(80% 50% at 100% 100%,rgba(74,222,128,.06),transparent 45%),#08080c;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 28px 70px rgba(0,0,0,.66)}
    .pop-title{font-size:20px;line-height:1.2;font-weight:740;letter-spacing:-.03em}.tagline{font-size:11px;color:#6b6b7a;margin-top:4px}.tab-info{font-size:12px;color:#a1a1b0;margin-top:12px;padding:8px 10px;background:#101018;border:1px solid rgba(255,255,255,.07);border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task{margin-top:10px;width:100%;padding:11px 13px;color:#ececf1;background:#1a1a26;border:1px solid rgba(255,255,255,.07);border-radius:10px;font-size:12px}.pref-label{margin-top:11px;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6b6b7a}.select{margin-top:5px;padding:8px 10px;border-radius:9px;background:#1a1a26;border:1px solid rgba(255,255,255,.07);font-size:11px;color:#ececf1}.check{font-size:10px;color:#9393a2;margin-top:8px}.toggle{margin-top:12px;width:100%;padding:12px;border-radius:11px;background:linear-gradient(#24242e,#1c1c26);border:1px solid rgba(255,255,255,.09);text-align:center;color:#ececf1;font-size:14px;font-weight:650}.toggle.locked{background:linear-gradient(#dc2626,#b91c1c);border-color:rgba(248,113,113,.5);color:white;box-shadow:0 5px 18px rgba(220,38,38,.25)}.manage{margin-top:9px;padding:9px 11px;border-radius:9px;background:#101018;border:1px solid rgba(255,255,255,.07);font-size:11px;color:#b3b3c1}.tabs{margin-top:7px}.tabrow{display:flex;align-items:center;gap:7px;font-size:10px;color:#b8bac5;padding:6px 7px}.fav{width:12px;height:12px;border-radius:3px;background:var(--blue)}.primary{margin-left:auto;color:#f87171;font-size:7px;text-transform:uppercase}.add{margin-top:5px;padding:7px;border:1px dashed rgba(96,165,250,.35);border-radius:8px;color:#60a5fa;background:rgba(96,165,250,.12);text-align:center;font-size:10px}.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);margin:14px 0}.section-title{font-size:9px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:#6b6b7a}.pomo-desc{font-size:11px;color:#a1a1b0;margin-top:9px}.primary-btn{margin-top:11px;padding:11px;border-radius:9px;background:linear-gradient(#3b82f6,#2563eb);font-size:12px;font-weight:650;text-align:center;box-shadow:0 5px 15px rgba(37,99,235,.3)}.task-live{margin-top:10px;padding:9px 11px;background:#181822;border:1px solid rgba(255,255,255,.07);border-radius:10px}.task-live small{display:block;color:#6b6b7a;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}.task-live span{font-size:11px;color:#ececf1}.timer{text-align:center;margin-top:10px;padding:13px;background:#181822;border:1px solid rgba(255,255,255,.07);border-radius:11px}.time{font-size:32px;line-height:1;font-weight:760;letter-spacing:-.03em}.phase{font-size:11px;color:#4ade80;font-weight:700;margin-top:6px}.phase.break{color:#fbbf24}.next{font-size:9px;color:#6b6b7a;margin-top:4px}.lifeline{margin-top:9px;padding:8px;border:1px dashed rgba(255,255,255,.13);border-radius:9px;text-align:center;color:#767685;font-size:10px}
    .breathing{position:absolute;inset:66px 0 0;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(59,130,246,.18),transparent 42%),linear-gradient(180deg,#09090f,#040406);z-index:4}.breath-card{text-align:center;width:430px;padding:38px;border-radius:24px;background:rgba(14,14,20,.72);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 80px rgba(0,0,0,.55)}.orb{position:relative;width:128px;height:128px;margin:0 auto 22px;border-radius:50%;border:2px solid rgba(96,165,250,.45);box-shadow:0 0 0 18px rgba(96,165,250,.07),0 0 60px rgba(96,165,250,.22)}.orb:after{content:"";position:absolute;inset:31px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#8b5cf6);box-shadow:0 0 30px rgba(96,165,250,.55)}.pause{font-size:11px;color:#93c5fd;text-transform:uppercase;letter-spacing:.15em;font-weight:760}.breathe-title{font-size:34px;font-weight:780;letter-spacing:-.04em;margin-top:10px}.breath-time{font-size:14px;color:#aeb8ca;margin-top:8px}.breath-task{margin-top:16px;padding:10px 14px;border-radius:12px;color:#dbeafe;background:rgba(96,165,250,.09);border:1px solid rgba(96,165,250,.17);font-size:12px}
    .tile{display:flex;align-items:center;background:radial-gradient(65% 110% at 18% 20%,rgba(96,165,250,.24),transparent 62%),radial-gradient(55% 95% at 86% 85%,rgba(139,92,246,.27),transparent 66%),#08080d}.tile-inner{display:flex;align-items:center;gap:7.5%;width:100%;padding:8.5%}.tile-icon{width:29%;filter:drop-shadow(0 20px 35px rgba(37,99,235,.27))}.tile-copy{flex:1}.tile-name{font-size:clamp(28px,8vw,48px);font-weight:820;letter-spacing:-.055em;line-height:1}.tile-tag{color:#c7d2fe;font-size:clamp(12px,3.7vw,20px);margin-top:8px;font-weight:520}.marquee .tile-inner{padding:5.5% 7%;gap:5%}.marquee .tile-icon{width:18%}.marquee .tile-name{font-size:72px}.marquee .tile-tag{font-size:27px}.marquee .mini-window{margin-left:auto;width:38%;height:72%;border-radius:18px;background:#10131b;border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 70px rgba(0,0,0,.5);overflow:hidden;transform:rotate(-1deg)}.mini-top{height:18%;background:#1b1e28;border-bottom:1px solid rgba(255,255,255,.07);padding:5%}.mini-top:before{content:"";display:block;width:38%;height:7px;border-radius:5px;background:#35394a}.mini-body{height:82%;display:grid;place-items:center}.mini-focus{width:58%;padding:7% 5%;border:1px solid rgba(255,255,255,.09);border-radius:14px;text-align:center;background:#0a0b11}.mini-focus b{display:block;font-size:15px}.mini-focus i{display:block;margin:12px auto 0;width:70%;height:8px;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
    .icon-asset{display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,rgba(59,130,246,.24),transparent 36%),radial-gradient(circle at 72% 72%,rgba(139,92,246,.15),transparent 42%),linear-gradient(145deg,#111225,#050508 58%)}.icon-asset .brand-mark{width:78%;height:78%;filter:drop-shadow(0 12px 22px rgba(37,99,235,.2))}.safe-badge{position:absolute;right:18px;bottom:16px;color:#687086;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body><div id="root"></div>
<script>
const params=new URLSearchParams(location.search);const asset=params.get('asset')||'screen1';
const mark=(cls='')=>`<svg class="brand-mark ${cls}" viewBox="0 0 512 512" aria-hidden="true"><rect class="mark-shell" x="38" y="38" width="436" height="436" rx="112"/><path class="mark-tab" d="M119 196v-22c0-29 23-52 52-52h170c29 0 52 23 52 52v167c0 29-23 52-52 52H171c-29 0-52-23-52-52V196Z"/><path class="mark-tab" style="stroke-width:11" d="M119 196h274M154 196l13-34c3-8 10-13 19-13h66c9 0 16 5 19 13l13 34"/><circle class="mark-line" cx="326" cy="159" r="5" style="fill:#70758b;stroke:none"/><circle class="mark-line" cx="347" cy="159" r="5" style="fill:#70758b;stroke:none"/><circle class="mark-ring" cx="256" cy="291" r="50"/><circle class="mark-glow" cx="256" cy="291" r="23"/></svg>`;
const popup=(kind)=>{const locked=kind!=='open';const pomo=kind==='focus'||kind==='break';const manager=kind==='manager';return `<div class="popup"><div class="pop-title">Tab Lock</div><div class="tagline">One tab. One focus.</div><div class="tab-info">${kind==='break'?'Focus resumes on':'Focus tab'}: Project brief${manager?' (+1 more)':''}</div>${locked?`<div class="task-live"><small>Current task</small><span>Finish launch brief</span></div>`:`<div class="task">Task (optional)&nbsp;&nbsp; Finish launch brief</div>`}<div class="pref-label">Blocked tab</div><div class="select">Breathing ritual (10s)&nbsp;&nbsp;⌄</div><div class="check">☑&nbsp; Ask before links leave the current site</div><div class="toggle ${locked?'locked':''}">${pomo?(kind==='break'?'☕ End Pomodoro':'⏱ End Pomodoro'):(locked?'🔒 Unlock Tab':'🔓 Lock Tab')}</div>${manager?`<div class="manage">Manage Locked Tabs <span style="float:right">⌄</span></div><div class="tabs"><div class="tabrow"><i class="fav"></i>Project brief <span class="primary">primary</span></div><div class="tabrow"><i class="fav" style="background:#8b5cf6"></i>Research notes <span style="margin-left:auto">×</span></div><div class="add">+ Add a tab</div></div>`:locked&&!pomo?`<div class="manage">Manage Locked Tabs <span style="float:right">›</span></div>`:''}<div class="divider"></div><div class="section-title">Pomodoro Focus</div>${pomo?`<div class="timer"><div class="time">${kind==='break'?'04:28':'58:42'}</div><div class="phase ${kind==='break'?'break':''}">${kind==='break'?'Break':'Focus'}</div><div class="next">${kind==='break'?'Next focus: 60 min':'Next break: 5 min'}</div></div><div class="lifeline">Lifeline · Hold 5 sec to cancel</div>`:`<div class="pomo-desc">60 min focus → 5/10/20 min breaks</div><div class="primary-btn">Start Pomodoro</div>`}</div>`};
const browser=(kind)=>`<div class="browser"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="browser-tab"><b></b>Project brief — Q4 launch</div><div class="address">🔒 docs.example.com/project-brief</div></div><div class="page"><div class="doc"><span class="doc-label">Project workspace</span><h3>Launch brief</h3><div class="rule"></div><div class="rule"></div><div class="rule"></div><div class="doc-card"><div class="rule"></div><div class="rule"></div><div class="rule"></div></div></div></div>${kind==='breathe'?`<div class="breathing"><div class="breath-card"><div class="orb"></div><div class="pause">Pause</div><div class="breathe-title">Breathe&nbsp;in</div><div class="breath-time">7 seconds</div><div class="breath-task">Finish launch brief</div></div></div>`:popup(kind)}</div>`;
const screens={
screen1:['Lock the tab.<br><span class="grad">Keep the intention.</span>','Choose the page that matters and make distraction require a deliberate decision.','open',['Local only','No account','One click']],
screen2:['Your work rarely<br><span class="grad">fits in one tab.</span>','Keep the brief, research, and references together—without opening the door to everything else.','manager',['Allowed-tab groups','Explicit control']],
screen3:['Focus time that<br><span class="grad">changes behavior.</span>','A built-in 60-minute focus cycle keeps the active tab protected while you work.','focus',['60-minute focus','Escalating breaks']],
screen4:['A real break.<br><span class="grad">Then back to focus.</span>','Browse freely during timed breaks. Tab protection returns automatically when focus resumes.','break',['5 → 10 → 20 min','Automatic return']],
screen5:['Interrupt the impulse.<br><span class="grad">Remember the task.</span>','A short breathing ritual adds just enough friction before Tab Lock returns you to your work.','breathe',['Optional 10s pause','Task reminder']]
};
function renderScreen(key){const [h,s,k,p]=screens[key];return `<main class="asset screen"><div class="noise"></div><section class="copy"><div class="eyebrow">Tab Lock · Focus Mode</div><h1 class="headline">${h}</h1><p class="sub">${s}</p><div class="proof">${p.map(x=>`<span>${x}</span>`).join('')}</div></section>${browser(k)}</main>`}
function renderTile(marquee=false){return `<main class="asset tile ${marquee?'marquee':''}"><div class="noise"></div><div class="tile-inner">${mark('tile-icon')}<div class="tile-copy"><div class="tile-name">Tab Lock</div><div class="tile-tag">One tab. One focus.</div></div>${marquee?`<div class="mini-window"><div class="mini-top"></div><div class="mini-body"><div class="mini-focus"><b>Stay with the task.</b><i></i></div></div></div>`:''}</div></main>`}
let html;if(asset==='icon')html=`<main class="asset icon-asset">${mark()}<div class="safe-badge"></div></main>`;else if(asset==='small')html=renderTile(false);else if(asset==='marquee')html=renderTile(true);else html=renderScreen(asset);document.getElementById('root').innerHTML=html;
</script></body></html>
