<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Lock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <section class="lock-section">
      <header class="app-header">
        <h1 class="app-title">Tab Lock</h1>
        <p class="app-tagline">One tab. One focus.</p>
      </header>
      <div class="tab-info" id="tabInfo">Loading...</div>
      <div class="task-input-wrap" id="taskInputWrap">
        <input type="text" class="task-input" id="taskInput" placeholder="Task (optional)" maxlength="200" />
      </div>
      <div class="task-display hidden" id="taskDisplay">
        <span class="task-display-label">Current task</span>
        <span class="task-display-text" id="taskDisplayText"></span>
      </div>
      <div class="preference-wrap">
        <label class="preference-label" for="wrongTabInterstitial">Blocked tab</label>
        <select class="preference-select" id="wrongTabInterstitial" name="wrongTabInterstitial">
          <option value="breathing">Breathing ritual (10s)</option>
          <option value="none">Return immediately</option>
        </select>
        <label class="checkbox-row" for="leaveDomainWarning">
          <input type="checkbox" id="leaveDomainWarning" />
          <span>Ask before links leave the current site</span>
        </label>
      </div>
      <button class="lock-toggle" id="lockToggle" type="button">
        <span class="lock-icon" id="lockIcon"></span>
        <span class="lock-label" id="lockLabel">Lock Tab</span>
      </button>
      <div class="gate-row hidden" id="sessionGate">
        <input type="password" class="task-input" id="gatePassword" placeholder="Protection password" autocomplete="current-password" />
        <input type="text" class="task-input" id="gatePhrase" placeholder="Challenge phrase" autocomplete="off" />
        <p class="gate-note" id="gateNote"></p>
      </div>
      <div class="tab-manager hidden" id="tabManager">
        <button class="tab-manager-toggle" id="tabManagerToggle" type="button">
          <span class="tab-manager-toggle-label">Manage Locked Tabs</span>
          <span class="tab-manager-arrow" id="tabManagerArrow">▸</span>
        </button>
        <div class="tab-manager-body hidden" id="tabManagerBody">
          <ul class="locked-tab-list" id="lockedTabList"></ul>
          <button class="add-tab-btn" id="addTabBtn" type="button">+ Add a tab</button>
          <div class="add-tab-picker hidden" id="addTabPicker">
            <ul class="available-tab-list" id="availableTabList"></ul>
          </div>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="pomodoro-section">
      <h2 class="section-title">Pomodoro Focus</h2>
      <div class="pomodoro-inactive" id="pomodoroInactive">
        <p class="pomodoro-desc" id="pomodoroDesc">60 min focus → 5/10/20 min breaks</p>
        <button class="btn-primary" id="startPomodoro" type="button">Start Pomodoro</button>
      </div>
      <div class="pomodoro-active hidden" id="pomodoroActive">
        <div class="timer-display">
          <div class="countdown" id="countdown">60:00</div>
          <div class="phase-label" id="phaseLabel">Focus</div>
          <div class="break-info" id="breakInfo"></div>
        </div>
        <button class="lifeline-btn" id="lifelineBtn" type="button">
          <span class="lifeline-label">Lifeline</span>
          <span class="lifeline-hint" id="lifelineHint">Hold 5 sec to cancel</span>
        </button>
      </div>
    </section>

    <section class="pro-section" id="proSection">
      <div class="divider"></div>
      <div class="pro-card">
        <div class="pro-card-top">
          <h2 class="section-title">Pro</h2>
          <span class="pro-badge" id="proBadge">Free</span>
        </div>
        <p class="pro-lead" id="proLead">Custom timers, strict mode, schedules, focus sets, stats, and your own blocked screen. Everything you use today stays free.</p>
        <div class="pro-plans" id="proPlans"></div>
        <div class="pro-activate">
          <input type="text" class="task-input" id="licenseKey" placeholder="Paste license key" autocomplete="off" spellcheck="false" />
          <button class="btn-secondary" id="activateLicense" type="button">Activate</button>
        </div>
        <p class="pro-message" id="proMessage"></p>
        <button class="btn-secondary" id="openPro" type="button">Pro settings and license</button>
      </div>
    </section>
  </div>
  <script src="hold.js"></script>
  <script src="popup.js"></script>
</body>
</html>
